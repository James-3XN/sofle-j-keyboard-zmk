  # send errors). No ZMK Studio in this one. Flash it only to investigate a problem.
  - board: eyelash_sofle_left
    shield: nice_view_custom raw_hid_adapter
    snippet: zmk-usb-logging
    artifact-name: eyelash_sofle_left_DIAGNOSTIC
  - board: nice_nano_v2
    shield: settings_reset
